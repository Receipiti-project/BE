services:
  mysql:
    image: mysql:8.0
    container_name: receipiti-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "receipiti2026@"
      MYSQL_DATABASE: receipiti
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: .
    container_name: receipiti-backend
    restart: always
    depends_on:
      - mysql
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/receipiti?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "receipiti2026@"

volumes:
  mysql_data: